name: Refresh official Burnaby data
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: official-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify deployment configuration
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DATA_DEPLOY_HOOK }}
        run: test -n "$DEPLOY_HOOK"
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r requirements-dev.lock
      - name: Download, recompute, and validate in staging
        run: .venv/bin/python -m backend.refresh --archive tmp/refresh-audit
      - run: .venv/bin/python -m pytest -q
      - run: npm ci && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - name: Preserve source acquisition and calculated results
        uses: actions/upload-artifact@v6
        with:
          name: official-data-${{ github.run_id }}
          path: tmp/refresh-audit/
          retention-days: 14
      - name: Commit validated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/data/dataset.json backend/data/manifest.json
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh validated official Burnaby data'
          # A concurrent main update rejects the push; never overwrite it.
          git push origin HEAD:main
      - name: Deploy and verify the published dataset
        env:
          VERCEL_DATA_DEPLOY_HOOK: ${{ secrets.VERCEL_DATA_DEPLOY_HOOK }}
        run: .venv/bin/python -m backend.verify_deployment
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: refresh-failure-${{ github.run_id }}
          path: frontend/test-results/
          retention-days: 7
